<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>📝 Регистрация</h1>
                <p class="subtitle">Создание нового аккаунта</p>
            </div>

            <!-- Сообщения об ошибках -->
            <div th:if="${errorMessage}" class="alert alert-error">
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/register}" th:object="${user}" method="post" class="auth-form">
                <div class="form-group">
                    <label for="username">👤 Имя пользователя</label>
                    <input type="text" 
                           id="username" 
                           th:field="*{username}" 
                           placeholder="Введите имя пользователя (мин. 3 символа)"
                           th:classappend="${#fields.hasErrors('username') or usernameError != null ? 'input-error' : ''}"
                           required 
                           autofocus>
                    <span th:if="${#fields.hasErrors('username')}" 
                          th:errors="*{username}" 
                          class="error-text"></span>
                    <span th:if="${usernameError != null}" 
                          th:text="${usernameError}" 
                          class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="password">🔑 Пароль</label>
                    <input type="password" 
                           id="password" 
                           th:field="*{password}" 
                           placeholder="Введите пароль (мин. 4 символа)"
                           th:classappend="${#fields.hasErrors('password') ? 'input-error' : ''}"
                           required>
                    <span th:if="${#fields.hasErrors('password')}" 
                          th:errors="*{password}" 
                          class="error-text"></span>
                </div>

                <div class="form-info">
                    <p>ℹ️ Новые пользователи получают роль <strong>USER</strong> (только просмотр)</p>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-large btn-full">
                        Зарегистрироваться
                    </button>
                </div>
            </form>

            <div class="auth-footer">
                <p>Уже есть аккаунт? <a th:href="@{/login}" class="auth-link">Войти</a></p>
            </div>
        </div>
    </div>
</body>
</html>
